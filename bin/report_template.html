<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flightrec · __TITLE__</title>
<style>
:root{--bg:#f7f7f5;--panel:#fff;--ink:#1d1d1b;--mute:#6b6b66;--line:#e4e3de;--accent:#2f5bd3;
--ok:#1f7a4d;--err:#c2362b;--warn:#b26a00;--info:#4a6fa5;--add:#e6f4ea;--addi:#1f7a4d;--del:#fbe9e7;--deli:#c2362b;--code:#f2f1ed}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--panel:#1d1d1b;--ink:#ecebe6;--mute:#9b9a94;--line:#33322f;
--accent:#7aa2ff;--ok:#5cc28d;--err:#ff7b6e;--warn:#e7a948;--info:#8fb0e0;--add:#16301f;--addi:#7fd6a2;--del:#3a1c18;--deli:#ff9a8f;--code:#262522}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
header{padding:14px 22px;border-bottom:1px solid var(--line);display:flex;gap:18px;align-items:baseline;flex-wrap:wrap}
header h1{font-size:17px;margin:0;font-weight:650}
header .m{color:var(--mute);font-size:12.5px}
.wrap{display:grid;grid-template-columns:290px 1fr;min-height:calc(100vh - 52px)}
aside{border-right:1px solid var(--line);overflow:auto;max-height:calc(100vh - 52px);position:sticky;top:0}
.sess{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.sess:hover{background:var(--panel)} .sess.on{background:var(--panel);box-shadow:inset 3px 0 0 var(--accent)}
.sess .d{font-weight:600;font-size:13px} .sess .s{color:var(--mute);font-size:12px;margin-top:2px}
.sess .p{font-size:12px;margin-top:4px;color:var(--ink);opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{padding:18px 24px 60px;min-width:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin:10px 0 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.card .v{font-size:20px;font-weight:650;font-variant-numeric:tabular-nums} .card .l{color:var(--mute);font-size:12px}
h2{font-size:15px;margin:22px 0 8px} .sid{font:12px ui-monospace,monospace;color:var(--mute)}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line);margin:6px 0}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--mute)} .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
.find{display:flex;gap:10px;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--panel);margin:5px 0;cursor:pointer;align-items:baseline}
.sev{font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.03em;min-width:52px}
.sev.warn{color:var(--warn)} .sev.info{color:var(--info)} .sev.error{color:var(--err)}
.kind{font:11.5px ui-monospace,monospace;color:var(--mute);min-width:140px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 10px;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:2}
select,input,button{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
.prompt{margin:16px 0 6px;padding:9px 12px;border-left:3px solid var(--accent);background:var(--panel);border-radius:0 7px 7px 0;white-space:pre-wrap;max-height:9em;overflow:auto}
.prompt .t{color:var(--mute);font-size:12px;display:block;margin-bottom:2px}
.call{border:1px solid var(--line);border-radius:7px;background:var(--panel);margin:4px 0}
.call.flag{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.row{display:grid;grid-template-columns:20px 34px 64px 52px 110px 1fr;gap:8px;padding:6px 10px;cursor:pointer;align-items:baseline}
.row .st{font-weight:700;text-align:center} .st.ok{color:var(--ok)} .st.error,.st.interrupted{color:var(--err)} .st.denied,.st.no_result{color:var(--warn)}
.num{font:12px ui-monospace,monospace;color:var(--mute);font-variant-numeric:tabular-nums}
.tool{font:12px ui-monospace,monospace;font-weight:600} .short{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:12.5px ui-monospace,monospace}
.chips{grid-column:6;display:flex;gap:5px;flex-wrap:wrap;margin-top:2px}
.chip{font:11.5px ui-monospace,monospace;padding:1px 6px;border-radius:4px;background:var(--code);color:var(--ink)}
.chip.uv{opacity:.65;border:1px dashed var(--line)} .chip.f{background:transparent;color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 50%,transparent)}
.chip.ag{color:var(--info)}
.det{display:none;border-top:1px solid var(--line);padding:10px 12px}
.call.open .det{display:block}
.det h4{margin:10px 0 4px;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.det h4:first-child{margin-top:0}
pre{margin:0;background:var(--code);padding:8px 10px;border-radius:6px;overflow:auto;max-height:420px;font:12px/1.45 ui-monospace,monospace;white-space:pre-wrap;word-break:break-word}
button{cursor:pointer}
pre .a{background:var(--add);color:var(--addi);display:block} pre .r{background:var(--del);color:var(--deli);display:block} pre .h{color:var(--info);display:block}
.ext{border:1px dashed var(--info);border-radius:7px;padding:7px 10px;margin:6px 0;background:var(--panel)}
.ext .row{grid-template-columns:20px 34px 64px 1fr;padding:0;cursor:pointer}
.note{color:var(--mute);font-size:12.5px}
details summary{cursor:pointer;color:var(--mute);font-size:12px}
.empty{color:var(--mute);padding:40px;text-align:center}
@media (max-width:820px){.wrap{grid-template-columns:1fr} aside{position:static;max-height:240px}}
</style>
</head>
<body>
<header><h1>flightrec · <span id="proj"></span></h1><span class="m" id="hm"></span></header>
<div class="wrap"><aside id="list"></aside><main id="main"><div class="empty">Nessuna sessione.</div></main></div>
<script type="application/json" id="data">__FLIGHTREC_DATA__</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = (t, a = {}, ...kids) => { const e = document.createElement(t);
  for (const [k, v] of Object.entries(a)) { if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v); }
  for (const k of kids) if (k != null) e.append(k); return e; };
const fmt = t => t ? new Date(t * 1000).toLocaleString('it-IT', {dateStyle: 'short', timeStyle: 'medium'}) : '–';
const hm = t => t ? new Date(t * 1000).toLocaleTimeString('it-IT') : '–';
const dur = s => s == null ? '–' : s < 1 ? (s * 1000).toFixed(0) + ' ms' : s < 60 ? s.toFixed(1) + ' s' : s < 3600 ? (s / 60).toFixed(1) + ' min' : (s / 3600).toFixed(1) + ' h';
const ICON = {ok: '✓', error: '✗', denied: '⊘', interrupted: '■', no_result: '?'};
const STL = {ok: 'riuscito', error: 'errore', denied: 'negato', interrupted: 'interrotto', no_result: 'senza risultato'};
const COLORS = ['#2f5bd3', '#1f7a4d', '#b26a00', '#8a3ffc', '#c2362b', '#0f7c8c', '#7a5c2e', '#d12771', '#5a6b7b', '#9aa52e'];
const n = x => (x || 0).toLocaleString('it-IT');

document.getElementById('proj').textContent = D.project.split('/').pop();
document.getElementById('hm').textContent = `${D.project} · ${D.sessions.length} sessioni · generato ${D.generated} · v${D.version}`;

function diffPre(text) {
  const pre = $('pre');
  for (const l of text.split('\n')) {
    const cls = l.startsWith('+++') || l.startsWith('---') || l.startsWith('diff ') || l.startsWith('index ') ? 'h'
      : l.startsWith('@@') ? 'h' : l.startsWith('+') ? 'a' : l.startsWith('-') ? 'r' : null;
    if (cls) pre.append($('span', {class: cls, text: l})); else pre.append(document.createTextNode(l + '\n'));
  }
  return pre;
}

function list() {
  const L = document.getElementById('list'); L.innerHTML = '';
  D.sessions.forEach((s, i) => {
    const st = s.stats, f = s.findings.filter(x => x.severity !== 'info').length;
    L.append($('div', {class: 'sess', 'data-i': i, onclick: () => show(i)},
      $('div', {class: 'd', text: fmt(st.start)}),
      $('div', {class: 's', text: `${st.prompts} prompt · ${st.calls} azioni · ${st.errors} errori · ${f} avvisi${st.recorded ? '' : ' · solo transcript'}`}),
      $('div', {class: 'p', text: s.prompts[0] ? s.prompts[0].text : '(nessun prompt)'})));
  });
}

function show(i) {
  document.querySelectorAll('.sess').forEach(e => e.classList.toggle('on', +e.dataset.i === i));
  const s = D.sessions[i], st = s.stats, M = document.getElementById('main'); M.innerHTML = '';
  location.hash = s.id;
  M.append($('div', {class: 'sid', text: `sessione ${s.id}` + (s.transcript ? ` · ${s.transcript}` : '')}));
  const tok = st.tokens || {};
  const cards = [[dur(st.duration), 'durata'], [st.prompts, 'prompt'], [st.calls, 'azioni'], [st.errors, 'errori'],
    [st.files_changed, 'file modificati'], [`+${n(st.lines_add)} −${n(st.lines_del)}`, 'righe'],
    [st.external_files, 'file cambiati da altri'], [dur(st.tool_time), 'tempo nei tool'],
    [n(tok.tokens_out), 'token in uscita'], [`${st.verified_calls}/${st.calls}`, 'azioni verificate su disco']];
  M.append($('div', {class: 'cards'}, ...cards.map(([v, l]) => $('div', {class: 'card'}, $('div', {class: 'v', text: String(v)}), $('div', {class: 'l', text: l})))));
  if (!st.recorded) M.append($('p', {class: 'note', text: 'Questa sessione non è stata registrata da flightrec: gli effetti sui file sono quelli dichiarati nel transcript, non verificati sul disco.'}));

  // distribuzione dei tool
  const tools = Object.entries(st.by_tool || {}), tot = tools.reduce((a, [, v]) => a + v, 0) || 1;
  if (tools.length) {
    M.append($('h2', {text: 'Azioni per tool'}));
    const bar = $('div', {class: 'bar'}), leg = $('div', {class: 'legend'});
    tools.forEach(([k, v], j) => { const c = COLORS[j % COLORS.length];
      bar.append($('div', {style: `width:${v / tot * 100}%;background:${c}`, title: `${k}: ${v}`}));
      leg.append($('span', {}, $('i', {style: `background:${c}`}), document.createTextNode(`${k} ${v}`))); });
    M.append(bar, leg);
  }

  // segnalazioni
  const F = s.findings;
  M.append($('h2', {text: `Segnalazioni (${F.length})`}));
  if (!F.length) M.append($('p', {class: 'note', text: 'Nessuna.'}));
  for (const f of F) M.append($('div', {class: 'find', onclick: () => f.call && openCall(f.call)},
    $('span', {class: 'sev ' + f.severity, text: f.severity === 'warn' ? 'avviso' : 'info'}),
    $('span', {class: 'kind', text: f.kind}), $('span', {text: f.message})));

  // cronologia
  M.append($('h2', {text: 'Cronologia'}));
  const tsel = $('select', {}, $('option', {value: '', text: 'tutti i tool'}), ...Object.keys(st.by_tool || {}).map(t => $('option', {value: t, text: t})));
  const ssel = $('select', {}, ...[['', 'tutte le azioni'], ['err', 'solo errori'], ['fs', 'che hanno cambiato file'], ['flag', 'con segnalazioni']].map(([v, t]) => $('option', {value: v, text: t})));
  const q = $('input', {placeholder: 'cerca in input, risultati, ragionamento…', size: 34});
  M.append($('div', {class: 'filters'}, tsel, ssel, q, $('button', {text: 'apri tutto', onclick: () => document.querySelectorAll('.call').forEach(c => c.classList.add('open'))}),
    $('button', {text: 'chiudi tutto', onclick: () => document.querySelectorAll('.call').forEach(c => c.classList.remove('open'))})));
  const TL = $('div'); M.append(TL);
  const fby = {}; for (const f of F) if (f.call) (fby[f.call] = fby[f.call] || []).push(f);

  // elementi in ordine di tempo: prompt, chiamate, modifiche esterne
  const items = [];
  s.prompts.forEach((p, j) => items.push({t: p.ts || 0, k: 'p', p, j}));
  s.calls.forEach(c => items.push({t: c.t || 0, k: 'c', c}));
  s.external.forEach(x => items.push({t: x.to || 0, k: 'x', x}));
  items.sort((a, b) => (a.t - b.t) || (a.k === 'p' ? -1 : 1));

  function render() {
    TL.innerHTML = '';
    const tf = tsel.value, sf = ssel.value, qq = q.value.toLowerCase();
    for (const it of items) {
      if (it.k === 'p') { if (!tf && !sf && !qq) TL.append($('div', {class: 'prompt'}, $('span', {class: 't', text: `prompt ${it.j + 1} · ${fmt(it.p.ts)}`}), document.createTextNode(it.p.text))); continue; }
      if (it.k === 'x') { if (tf || (sf && sf !== 'fs') || qq) continue; TL.append(extEl(it.x)); continue; }
      const c = it.c, fl = fby[c.id] || [];
      if (tf && c.tool !== tf) continue;
      if (sf === 'err' && c.status === 'ok') continue;
      if (sf === 'fs' && !c.fs.length) continue;
      if (sf === 'flag' && !fl.length) continue;
      if (qq && ![c.input, c.result, c.intent, c.thinking, c.short].some(x => x && x.toLowerCase().includes(qq))) continue;
      TL.append(callEl(c, fl));
    }
  }
  [tsel, ssel].forEach(e => e.addEventListener('change', render)); q.addEventListener('input', render);
  render();
}

function callEl(c, fl) {
  const chips = $('div', {class: 'chips'});
  if (c.agent) chips.append($('span', {class: 'chip ag', text: 'subagente ' + c.agent.slice(0, 8)}));
  for (const ch of c.fs) chips.append($('span', {class: 'chip' + (c.verified ? '' : ' uv'), title: c.verified ? 'verificato sul disco' : 'dichiarato nel transcript, non verificato',
    text: `${ch.status} ${ch.path} +${ch.add}/−${ch.del}`}));
  for (const f of fl) chips.append($('span', {class: 'chip f', text: f.kind}));
  const row = $('div', {class: 'row', onclick: () => el.classList.toggle('open')},
    $('span', {class: 'st ' + c.status, text: ICON[c.status] || '?', title: STL[c.status]}),
    $('span', {class: 'num', text: '#' + c.seq}), $('span', {class: 'num', text: hm(c.t)}), $('span', {class: 'num', text: dur(c.dur)}),
    $('span', {class: 'tool', text: c.tool}), $('span', {class: 'short', text: c.short}));
  if (chips.childNodes.length) row.append(chips);
  const det = $('div', {class: 'det'});
  if (c.intent) det.append($('h4', {text: 'Cosa ha detto prima'}), $('pre', {text: c.intent}));
  if (c.thinking) det.append($('details', {}, $('summary', {text: 'ragionamento'}), $('pre', {text: c.thinking})));
  det.append($('h4', {text: `Input · ${c.id}`}), $('pre', {text: c.input}));
  det.append($('h4', {text: 'Risultato · ' + (STL[c.status] || c.status)}), $('pre', {text: c.result == null ? '(nessun risultato)' : c.result || '(vuoto)'}));
  for (const f of fl) det.append($('p', {class: 'note', text: '⚠ ' + f.message}));
  if (c.conc && c.conc.length) det.append($('p', {class: 'note', text: `In parallelo con: ${c.conc.join(', ')}. Le modifiche ai file nello stesso intervallo sono attribuite a entrambe.`}));
  if (c.diff) det.append($('h4', {text: 'Effetto reale sui file (diff)'}), diffPre(c.diff));
  else if (c.fs.length && !c.verified) det.append($('p', {class: 'note', text: 'Effetto dichiarato nel transcript; nessuna foto del disco per verificarlo.'}));
  else if (c.verified) det.append($('p', {class: 'note', text: 'Verificato: nessun file cambiato sul disco.'}));
  const el = $('div', {class: 'call' + (fl.some(f => f.severity !== 'info') ? ' flag' : ''), id: 'c-' + c.id}, row, det);
  return el;
}

function extEl(x) {
  const det = $('div', {class: 'det'}); if (x.diff) det.append(diffPre(x.diff));
  const el = $('div', {class: 'ext'}, $('div', {class: 'row', onclick: () => el.classList.toggle('open')},
    $('span', {class: 'st', text: '✎'}), $('span', {class: 'num', text: ''}), $('span', {class: 'num', text: hm(x.to)}),
    $('span', {text: `Modifiche fuori da Claude (tu o un altro processo): ${x.changes.map(c => `${c.path} +${c.add}/−${c.del}`).join(', ')}`})), det);
  el.classList.add('call'); return el;
}

function openCall(id) { const e = document.getElementById('c-' + id); if (e) { e.classList.add('open'); e.scrollIntoView({behavior: 'smooth', block: 'center'}); } }

list();
if (D.sessions.length) { const h = location.hash.slice(1); const k = D.sessions.findIndex(s => s.id === h); show(k >= 0 ? k : 0); }
</script>
</body>
</html>
